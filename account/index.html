<main class="wide">
<div class="qh-wrap">
<div class="h-top">
  <div class="h-top-left">
    <a class="h-back" href="/">&larr; PDF Occlusion</a>
    <div class="h-title">Account</div>
  </div>
  <div class="h-top-right">
    <span class="h-who" id="who"></span>
    <span class="h-rule"></span>
    <a class="h-link" href="/quiz/">Quizzes</a>

  </div>
</div>
<div class="h-content">
  <div class="h-desk">
    <div class="h-card hidden" id="signed-out">
      <div class="h-row">
        <div class="h-left"><div class="h-name">Sign In to See Your Credits and Plan</div></div>
        <div class="h-actions"><button class="h-btn" id="sign-in" type="button"><svg class="g-icon" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>Sign In with Google</button></div>

    </div>

    <div class="hidden a-stack" id="signed-in">

      <div class="h-card">

            <a class="h-btn" href="/pricing/" id="upgrade">View Plans</a>
            <button class="h-btn outline" id="pack" type="button">Buy 400 Credits</button>

        </div>

          <div class="a-left"><span id="left">0</span> <span class="a-left-note" id="left-note">credits remaining</span></div>
          <dl class="a-kv">
            <dt>Plan</dt><dd id="plan">None</dd>
            <dt class="hidden" id="month-k">This month</dt><dd class="hidden" id="month"></dd>

        </div>
      </div>

<script type="module">
import { watchUser, signIn, forceSignOut, deleteSignIn, api, when } from "/assets/app.js";
const $ = (id) => document.getElementById(id);
let user = null;
const err = (m) => { $("acct-error").textContent = m; $("acct-error").classList.remove("hidden"); };
const n = (x) => Number(x || 0).toLocaleString();
$("sign-in").addEventListener("click", () => signIn().catch((e) => err(e.message)));
$("top-sign-out").addEventListener("click", (e) => { e.currentTarget.disabled = true; forceSignOut(); });
// if sign-in never loads, offer it again rather than an empty page
let known = false;
setTimeout(() => { if (!known) $("signed-out").classList.remove("hidden"); }, 8000);
const paid = new URLSearchParams(location.search).get("paid");
if (paid) {
  $("paid").textContent = paid === "pack" ? "Thank you. 400 credits were added to your account." : "Thank you. Your plan is active.";
  $("paid").classList.remove("hidden");
}
// credits from the server, or pages from a server that does not count credits yet
function credits(me) {
  const c = me.credits || {};
  return {
    left: me.credits_left ?? me.pages_left ?? 0,
    free: c.free ?? me.free_left ?? 0,
    used: c.plan_used ?? me.plan_used ?? 0,
    allowance: c.plan_allowance ?? me.plan_allowance ?? 0,
    pack: c.pack ?? me.pack_pages ?? 0,
  };
}
function item(name, stat, button) {
  const d = document.createElement("div");
  d.className = "h-item";
  d.innerHTML = '<span class="h-item-name"></span><span class="h-stat"></span>';
  d.children[0].textContent = name;
  d.children[1].textContent = stat;
  if (button) d.append(button);
  return d;
}
// first click asks, second does it
function confirmed(b, ask) {
  if (b.classList.contains("armed")) return true;
  b.dataset.label = b.textContent;
  b.classList.add("armed");
  b.textContent = ask;
  setTimeout(() => { if (b.isConnected && b.classList.contains("armed")) { b.classList.remove("armed"); b.textContent = b.dataset.label; } }, 4000);
  return false;
}
function signOutOne(d) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "h-small";
  b.textContent = "Sign Out";
  b.addEventListener("click", async () => {
    if (!confirmed(b, "Confirm Sign Out")) return;
    b.disabled = true;
    try { await api("/v1/devices/sign-out", { method: "POST", body: { id: d.id }, user }); await load(); }
    catch (e) { err(e.message); b.disabled = false; }
  });
  return b;
}
const row = (id, text) => { $(id).textContent = text || ""; $(id).classList.toggle("hidden", !text); $(id + "-k").classList.toggle("hidden", !text); };
async function load() {
  const me = await api("/v1/me", { user });
  const c = credits(me);
  $("who").textContent = me.email || "";
  $("left").textContent = n(c.left);
  $("left-note").textContent = c.left === 1 ? "credit remaining" : "credits remaining";
  $("plan").textContent = me.plan === "yearly" ? "Yearly" : me.plan === "monthly" ? "Monthly" : "None";
  row("month", me.plan ? `${n(c.used)} of ${n(c.allowance)} used` : "");
  $("upgrade").classList.toggle("hidden", !!me.plan);
  $("billing").classList.toggle("hidden", !me.plan && !c.pack && !paid);
  const dev = $("devices"); dev.replaceChildren();
  for (const d of me.devices) dev.append(item(d.label || "Anki", d.last_used ? `Last used ${when(d.last_used)}` : `Linked ${when(d.created_at)}`, d.id ? signOutOne(d) : null));
  dev.classList.toggle("hidden", me.devices.length === 0);
  $("no-devices").classList.toggle("hidden", me.devices.length > 0);
  $("unlink").classList.toggle("hidden", me.devices.length < 2);
  const jobs = $("jobs"); jobs.replaceChildren();
  for (const j of me.jobs) jobs.append(item(j.lecture || "Untitled PDF", `${j.slides_total} ${j.slides_total === 1 ? "slide" : "slides"}, ${when(j.created_at)}`));
  jobs.classList.toggle("hidden", me.jobs.length === 0);
  $("clear-history").classList.toggle("hidden", me.jobs.length === 0);
  $("no-jobs").classList.toggle("hidden", me.jobs.length > 0);
}
watchUser(async (u) => {
  user = u;
  known = true;
  $("top-sign-out").classList.toggle("hidden", !u);
  $("signed-out").classList.toggle("hidden", !!u);
  $("signed-in").classList.toggle("hidden", !u);
  if (u) load().catch((e) => err(e.message));
});
async function go(path, body) {
  try { const { url } = await api(path, { method: "POST", body, user }); location.href = url; }
  catch (e) { err(e.message); }
}
$("pack").addEventListener("click", () => go("/v1/checkout", { product: "pack" }));
$("billing").addEventListener("click", () => go("/v1/portal"));
const asking = (on) => {
  $("delete").classList.toggle("hidden", on);
  $("delete-yes").classList.toggle("hidden", !on);
  $("delete-no").classList.toggle("hidden", !on);
};
$("delete").addEventListener("click", () => asking(true));
$("delete-no").addEventListener("click", () => asking(false));
$("delete-yes").addEventListener("click", async () => {
  try { await api("/v1/me/delete", { method: "POST", user }); asking(false); await deleteSignIn(); }
  catch (e) { err(e.message); }
});
$("clear-history").addEventListener("click", async () => {
  const b = $("clear-history");
  if (!confirmed(b, "Confirm Clear")) return;
  b.disabled = true;
  try { await api("/v1/history/clear", { method: "POST", user }); b.classList.remove("armed"); b.textContent = "Clear History"; await load(); }
  catch (e) { err(e.message); }
  b.disabled = false;
});
$("unlink").addEventListener("click", async () => {
  try { await api("/v1/devices/sign-out", { method: "POST", user }); await load(); } catch (e) { err(e.message); }
});
</script>
<script>
(function () {
  try {
    var k = "po-anon", id = localStorage.getItem(k);
    if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now(); localStorage.setItem(k, id); }
    var api = "https://pdf-occlusion-api.pdf-occlusion.workers.dev/v1/events";
    var send = function (name, props) {
      try { navigator.sendBeacon(api, new Blob([JSON.stringify({ anon: id, events: [{ name: name, at: Date.now(), props: props }] })], { type: "text/plain" })); } catch (e) {}
    };
    window.poTrack = send;
    var ref = document.referrer ? new URL(document.referrer).hostname : "";
    var utm = new URLSearchParams(location.search).get("utm_source") || "";
    send("page_view", { path: location.pathname, ref: ref === location.hostname ? "" : ref, utm: utm.slice(0, 40) });
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a, button");
      if (a) send("click", { window: "web", page: location.pathname, button: (a.textContent || a.getAttribute("aria-label") || "").trim().slice(0, 60), href: (a.getAttribute("href") || "").split("?")[0] });
    }, true);
  } catch (e) {}
})();
</script>
